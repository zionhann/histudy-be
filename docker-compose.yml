services:
  histudy-be:
    image: ${IMAGE_NAME:-histudy-be}:${IMAGE_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE:-dev}
      SPRING_CONFIG_ADDITIONAL_LOCATION: file:/webapp/config/application-${ACTIVE_PROFILE:-dev}.yml
      LOG_PATH: /webapp/log
      LOGBACK_ROLLINGPOLICY_MAX_HISTORY: ${LOGBACK_ROLLINGPOLICY_MAX_HISTORY:-30}
      LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE: ${LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE:-100MB}
    volumes:
      - ${CONFIG_PATH:-/etc/histudy-be/}:/webapp/config/:ro
      - webapp_images:/webapp/image
      - webapp_logs:/webapp/log

volumes:
  webapp_images:
  webapp_logs:
